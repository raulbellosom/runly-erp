# Self-hosted Supabase stack for Runly's local-mode PRODUCTION installs.
#
# Adapted from the official supabase/supabase self-hosting reference at tag
# v1.26.08 (docker/docker-compose.yml) — see VENDORED_FROM.md for exactly
# what was vendored and what changed. Trimmed to the services Runly actually
# uses (Postgres, Auth, REST, Realtime, Storage, Meta, Studio, Kong).
# Supavisor pooling, Edge Functions, imgproxy image transforms, and the
# Logs/Analytics stack are dropped: nothing in Runly consumes them, and
# every Runly-side service (api/worker, migrate/seed) already reaches
# Postgres directly over the Compose network, so a connection pooler buys
# nothing at Runly's single-VM scale.
#
# This file is merged into the SAME Compose project as docker-compose.yml
# via an extra `-f` flag from setup-local.mjs (RUNLY_SUPABASE_MODE=selfhosted
# only) — same project name, same default network, same volume namespace as
# the rest of this Runly instance. All secrets/ports referenced below are
# generated/persisted by lib/supabase-selfhosted-config.mjs into .env.local
# (container secrets) and mirrored into .env (Compose ${VAR} interpolation),
# exactly like every other installer-managed variable.
#
# Hard security rules (do not override via env vars):
#   - supabase-db: never published to the host. Use
#     `docker exec -it <prefix>-supabase-db psql -U postgres` for local access.
#   - supabase-studio: loopback-only (127.0.0.1). Reach it via an SSH tunnel,
#     e.g. `ssh -L 54323:127.0.0.1:<RUNLY_SUPABASE_STUDIO_HOST_PORT> user@vps`.
#   - supabase-kong is the only Supabase-side service that follows
#     RUNLY_PUBLIC_BIND_ADDR, because the browser talks to Auth/Realtime/
#     Storage directly through it (see apps/desktop/src/lib/supabase.js).

services:
  supabase-db:
    image: supabase/postgres:17.6.1.136
    container_name: ${RUNLY_CONTAINER_PREFIX:-runly}-supabase-db
    restart: unless-stopped
    volumes:
      - ./supabase/volumes/db/realtime.sql:/docker-entrypoint-initdb.d/migrations/99-realtime.sql:ro
      - ./supabase/volumes/db/webhooks.sql:/docker-entrypoint-initdb.d/init-scripts/98-webhooks.sql:ro
      - ./supabase/volumes/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - ./supabase/volumes/db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:ro
      - supabase-db-data:/var/lib/postgresql/data
      - supabase-db-config:/etc/postgresql-custom
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: "5432"
      POSTGRES_PORT: "5432"
      PGPASSWORD: ${SUPABASE_POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${SUPABASE_POSTGRES_PASSWORD}
      PGDATABASE: postgres
      POSTGRES_DB: postgres
      JWT_SECRET: ${SUPABASE_JWT_SECRET}
      JWT_EXP: ${SUPABASE_JWT_EXPIRY:-3600}
    command:
      ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "log_min_messages=fatal"]

  supabase-auth:
    image: supabase/gotrue:v2.189.0
    container_name: ${RUNLY_CONTAINER_PREFIX:-runly}-supabase-auth
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      timeout: 5s
      interval: 5s
      retries: 3
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: ${RUNLY_SUPABASE_PUBLIC_URL:-http://localhost:8000}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${SUPABASE_POSTGRES_PASSWORD}@supabase-db:5432/postgres
      GOTRUE_SITE_URL: ${CORS_ORIGIN:-http://localhost:5173}
      GOTRUE_URI_ALLOW_LIST: ${RUNLY_SUPABASE_ADDITIONAL_REDIRECT_URLS:-}
      GOTRUE_DISABLE_SIGNUP: ${RUNLY_SUPABASE_DISABLE_SIGNUP:-false}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${SUPABASE_JWT_EXPIRY:-3600}
      GOTRUE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      GOTRUE_JWT_ISSUER: ${RUNLY_SUPABASE_PUBLIC_URL:-http://localhost:8000}/auth/v1
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_MAILER_AUTOCONFIRM: ${RUNLY_SUPABASE_MAILER_AUTOCONFIRM:-false}
      GOTRUE_SMTP_ADMIN_EMAIL: ${RUNLY_SUPABASE_SMTP_ADMIN_EMAIL:-}
      GOTRUE_SMTP_HOST: ${RUNLY_SUPABASE_SMTP_HOST:-}
      GOTRUE_SMTP_PORT: ${RUNLY_SUPABASE_SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${RUNLY_SUPABASE_SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${RUNLY_SUPABASE_SMTP_PASS:-}
      GOTRUE_SMTP_SENDER_NAME: ${RUNLY_SUPABASE_SMTP_SENDER_NAME:-Runly}
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_SMS_AUTOCONFIRM: "false"

  supabase-rest:
    image: postgrest/postgrest:v14.12
    container_name: ${RUNLY_CONTAINER_PREFIX:-runly}-supabase-rest
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "postgrest", "--ready"]
      interval: 5s
      timeout: 5s
      retries: 3
    environment:
      PGRST_DB_URI: postgres://authenticator:${SUPABASE_POSTGRES_PASSWORD}@supabase-db:5432/postgres
      PGRST_DB_SCHEMAS: public,graphql_public
      PGRST_DB_MAX_ROWS: "1000"
      PGRST_DB_EXTRA_SEARCH_PATH: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_USE_LEGACY_GUCS: "false"
      # Required for the "postgrest --ready" healthcheck below — without an
      # admin server, --ready has nothing to query and the container is
      # reported unhealthy even though PostgREST itself is running fine.
      PGRST_ADMIN_SERVER_PORT: "3001"
      PGRST_ADMIN_SERVER_HOST: localhost
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: ${SUPABASE_JWT_EXPIRY:-3600}
    command: ["postgrest"]

  supabase-realtime:
    image: supabase/realtime:v2.102.3
    container_name: ${RUNLY_CONTAINER_PREFIX:-runly}-supabase-realtime
    # Fixed on purpose (not instance-prefixed): Realtime's self-host tenant
    # seeding (SEED_SELF_HOST) derives its default tenant id from the
    # container's own OS hostname, and Kong's kong.yml hardcodes this exact
    # hostname to reach it. `hostname:` is only resolvable inside this
    # Compose project's own private network, so two Runly instances on the
    # same host can each use it without colliding (unlike `container_name`,
    # which is instance-prefixed above because it IS host-global).
    hostname: realtime-dev.supabase-realtime
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sSfL --head -o /dev/null -H \"Authorization: Bearer ${SUPABASE_ANON_KEY}\" http://localhost:4000/api/tenants/realtime-dev/health"
        ]
      timeout: 5s
      interval: 30s
      retries: 3
      start_period: 10s
    environment:
      PORT: "4000"
      DB_HOST: supabase-db
      DB_PORT: "5432"
      DB_USER: supabase_admin
      DB_PASSWORD: ${SUPABASE_POSTGRES_PASSWORD}
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: 'SET search_path TO _realtime'
      DB_ENC_KEY: ${RUNLY_SUPABASE_REALTIME_DB_ENC_KEY}
      API_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      SECRET_KEY_BASE: ${RUNLY_SUPABASE_SECRET_KEY_BASE}
      METRICS_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"
      DISABLE_HEALTHCHECK_LOGGING: "true"

  supabase-storage:
    image: supabase/storage-api:v1.60.4
    container_name: ${RUNLY_CONTAINER_PREFIX:-runly}-supabase-storage
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
      supabase-rest:
        condition: service_started
    healthcheck:
      # Uses the service's own Docker-DNS name, not "localhost": storage-api
      # only binds its IPv4 addresses, and busybox wget's "localhost" tries
      # ::1 first inside this image, which is refused (verified against a
      # real run — matches upstream's own choice for this specific service).
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://supabase-storage:5000/status"]
      timeout: 5s
      interval: 5s
      retries: 3
      start_period: 10s
    environment:
      ANON_KEY: ${SUPABASE_ANON_KEY}
      SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      POSTGREST_URL: http://supabase-rest:3000
      AUTH_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${SUPABASE_POSTGRES_PASSWORD}@supabase-db:5432/postgres
      STORAGE_PUBLIC_URL: ${RUNLY_SUPABASE_PUBLIC_URL:-http://localhost:8000}
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
      FILE_SIZE_LIMIT: "52428800"
      STORAGE_BACKEND: file
      GLOBAL_S3_BUCKET: stub
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      # No imgproxy sidecar — Runly generates its own image variants
      # (apps/api/src/lib/image-variants.js) instead of using Storage's
      # on-the-fly transform feature.
      ENABLE_IMAGE_TRANSFORMATION: "false"
    volumes:
      - supabase-storage-data:/var/lib/storage

  supabase-meta:
    image: supabase/postgres-meta:v0.96.6
    container_name: ${RUNLY_CONTAINER_PREFIX:-runly}-supabase-meta
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
      PG_META_PORT: "8080"
      PG_META_DB_HOST: supabase-db
      PG_META_DB_PORT: "5432"
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${SUPABASE_POSTGRES_PASSWORD}
      CRYPTO_KEY: ${RUNLY_SUPABASE_META_CRYPTO_KEY}

  supabase-studio:
    image: supabase/studio:2026.08.03-sha-022b374
    container_name: ${RUNLY_CONTAINER_PREFIX:-runly}-supabase-studio
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
      supabase-meta:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3000/api/platform/profile').then((r) => {if (r.status !== 200) throw new Error(r.status)})\""
        ]
      timeout: 10s
      interval: 5s
      retries: 3
      start_period: 20s
    environment:
      HOSTNAME: "0.0.0.0"
      STUDIO_PG_META_URL: http://supabase-meta:8080
      POSTGRES_PORT: "5432"
      POSTGRES_HOST: supabase-db
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${SUPABASE_POSTGRES_PASSWORD}
      POSTGRES_USER_READ_WRITE: postgres
      PG_META_CRYPTO_KEY: ${RUNLY_SUPABASE_META_CRYPTO_KEY}
      PGRST_DB_SCHEMAS: public,graphql_public
      DEFAULT_ORGANIZATION_NAME: Runly
      DEFAULT_PROJECT_NAME: Runly
      SUPABASE_URL: http://supabase-kong:8000
      SUPABASE_PUBLIC_URL: ${RUNLY_SUPABASE_PUBLIC_URL:-http://localhost:8000}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${SUPABASE_JWT_SECRET}
    ports:
      # Admin-only dashboard. Loopback ONLY — never reachable off-host, and
      # never routed through supabase-kong either. Reach it with:
      #   ssh -L 54323:127.0.0.1:<RUNLY_SUPABASE_STUDIO_HOST_PORT> <user>@<host>
      - "127.0.0.1:${RUNLY_SUPABASE_STUDIO_HOST_PORT:-54323}:3000"

  supabase-kong:
    image: kong/kong:3.9.3
    container_name: ${RUNLY_CONTAINER_PREFIX:-runly}-supabase-kong
    restart: unless-stopped
    depends_on:
      supabase-auth:
        condition: service_healthy
      supabase-rest:
        condition: service_healthy
      supabase-storage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      # The only Supabase-side port that follows RUNLY_PUBLIC_BIND_ADDR: the
      # browser talks to Auth/Realtime/Storage through this gateway directly.
      - "${RUNLY_PUBLIC_BIND_ADDR:-0.0.0.0}:${RUNLY_SUPABASE_KONG_HOST_PORT:-8000}:8000/tcp"
    volumes:
      - ./supabase/volumes/api/kong.yml:/home/kong/temp.yml:ro
      - ./supabase/volumes/api/kong-entrypoint.sh:/home/kong/kong-entrypoint.sh:ro
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/kong.yml
      KONG_ROUTER_FLAVOR: expressions
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_DNS_NOT_FOUND_TTL: "1"
      KONG_DNS_VALID_TTL: "5"
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,request-termination,post-function
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      KONG_PROXY_ACCESS_LOG: /dev/stdout combined
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_PUBLISHABLE_KEY: ""
      SUPABASE_SECRET_KEY: ""
    entrypoint: ["/bin/sh", "/home/kong/kong-entrypoint.sh"]

volumes:
  supabase-db-data:
  supabase-db-config:
  supabase-storage-data:
