# RUNLY_COMPOSE_PROJECT_NAME isolates this installation's project (and thus its
# default network + all volume names, which Compose prefixes with the project
# name) from any other Runly instance on the same host. Set automatically by
# setup-local.mjs / setup-external.mjs; defaults to the legacy fixed name so
# manual `docker compose` invocations against an existing install are unaffected.
name: ${RUNLY_COMPOSE_PROJECT_NAME:-runlyerp}

services:
  collabora:
    image: collabora/code:26.04.2.4.1
    profiles: ["office"]
    environment:
      aliasgroup1: ${COLLABORA_WOPI_HOST:-http://api:4010}
      extra_params: ${COLLABORA_EXTRA_PARAMS:---o:ssl.enable=false --o:ssl.termination=false --o:logging.level=warning}
      content_security_policy: ${COLLABORA_CONTENT_SECURITY_POLICY:-frame-ancestors http://localhost:5173 http://tauri.localhost https://tauri.localhost tauri://localhost;}
    ports:
      # Collabora is an internal editor backend — never publish beyond loopback.
      - "127.0.0.1:${RUNLY_COLLABORA_HOST_PORT:-9980}:9980"
    # CODE 26 includes /usr/bin/coolwsd --probe; retain its native healthcheck.
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  runly-api-external:
    image: ${RUNLY_API_IMAGE:-raulbellosom/runlyerp:api-latest}
    container_name: ${RUNLY_CONTAINER_PREFIX:-runly}-api-external
    profiles: ["external"]
    env_file:
      - ./.env.external
    environment:
      RUNLY_PROJECT_ROOT: /app
      RUNLY_MODULES_DIR: /app/modules/custom
    ports:
      # RUNLY_PUBLIC_BIND_ADDR restricts the published port to a single
      # interface (e.g. 127.0.0.1 when a reverse proxy sits in front); it
      # defaults to 0.0.0.0 to preserve current behavior.
      - "${RUNLY_PUBLIC_BIND_ADDR:-0.0.0.0}:${RUNLY_API_HOST_PORT:-4010}:4010"
    volumes:
      - ./custom-modules:/app/modules/custom
      - ./.secrets/firebase:/run/secrets/firebase:ro
    networks:
      default:
        aliases:
          - api
    restart: unless-stopped

  runly-worker-external:
    image: ${RUNLY_WORKER_IMAGE:-raulbellosom/runlyerp:worker-latest}
    container_name: ${RUNLY_CONTAINER_PREFIX:-runly}-worker-external
    profiles: ["external"]
    env_file:
      - ./.env.external
    environment:
      RUNLY_PROJECT_ROOT: /app
    volumes:
      - ./custom-modules:/app/modules/custom
      - ./.secrets/firebase:/run/secrets/firebase:ro
    restart: unless-stopped

  runly-web-external:
    image: ${RUNLY_WEB_EXTERNAL_IMAGE:-raulbellosom/runlyerp:web-latest}
    container_name: ${RUNLY_CONTAINER_PREFIX:-runly}-web-external
    profiles: ["external"]
    environment:
      RUNLY_API_URL: ${RUNLY_API_URL:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
    ports:
      - "${RUNLY_PUBLIC_BIND_ADDR:-0.0.0.0}:${RUNLY_WEB_HOST_PORT:-5173}:80"
    depends_on:
      - runly-api-external
    restart: unless-stopped

  runly-api-local:
    image: ${RUNLY_API_LOCAL_IMAGE:-raulbellosom/runlyerp:api-latest}
    container_name: ${RUNLY_CONTAINER_PREFIX:-runly}-api-local
    profiles: ["local"]
    env_file:
      - ./.env.local
    environment:
      RUNLY_PROJECT_ROOT: /app
      RUNLY_MODULES_DIR: /app/modules/custom
    ports:
      - "${RUNLY_PUBLIC_BIND_ADDR:-0.0.0.0}:${RUNLY_API_HOST_PORT:-4010}:4010"
    volumes:
      - ./custom-modules:/app/modules/custom
      - ./.secrets/firebase:/run/secrets/firebase:ro
    networks:
      default:
        aliases:
          - api
    restart: unless-stopped

  runly-worker-local:
    image: ${RUNLY_WORKER_LOCAL_IMAGE:-raulbellosom/runlyerp:worker-latest}
    container_name: ${RUNLY_CONTAINER_PREFIX:-runly}-worker-local
    profiles: ["local"]
    env_file:
      - ./.env.local
    environment:
      RUNLY_PROJECT_ROOT: /app
    volumes:
      - ./custom-modules:/app/modules/custom
      - ./.secrets/firebase:/run/secrets/firebase:ro
    restart: unless-stopped

  runly-web-local:
    image: ${RUNLY_WEB_LOCAL_IMAGE:-raulbellosom/runlyerp:web-latest}
    container_name: ${RUNLY_CONTAINER_PREFIX:-runly}-web-local
    profiles: ["local"]
    environment:
      RUNLY_API_URL: ${RUNLY_API_URL:-http://localhost:4010}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
    ports:
      - "${RUNLY_PUBLIC_BIND_ADDR:-0.0.0.0}:${RUNLY_WEB_HOST_PORT:-5173}:80"
    depends_on:
      - runly-api-local
    restart: unless-stopped

  livekit-redis:
    image: ${LIVEKIT_REDIS_IMAGE:-redis:7-alpine}
    container_name: ${RUNLY_CONTAINER_PREFIX:-runly}-livekit-redis
    profiles: ["livekit"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  livekit:
    image: ${LIVEKIT_IMAGE:-livekit/livekit-server:v1.12.0}
    container_name: ${RUNLY_CONTAINER_PREFIX:-runly}-livekit
    profiles: ["livekit"]
    command: ["--config", "/etc/livekit/livekit.yaml"]
    depends_on:
      livekit-redis:
        condition: service_healthy
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit/livekit.yaml:ro
    ports:
      - "${LIVEKIT_HTTP_HOST_PORT:-7880}:7880/tcp"
      - "${LIVEKIT_RTC_TCP_PORT:-7881}:7881/tcp"
      - "${LIVEKIT_RTC_UDP_PORT:-7882}:7882/udp"
    restart: unless-stopped

  # Separate opt-in profile (not bundled into "livekit") because this
  # container mounts the host's docker.sock — a materially larger trust
  # boundary than livekit/livekit-redis, which have no host access at all.
  # Same reasoning as livekit-caddy's own "livekit-tls" profile: an optional
  # add-on to the base voice/video stack shouldn't be silently included for
  # every deployment. setup-external.mjs/setup-local.mjs add this profile
  # (and render livekit/egress.yaml) automatically once SUPABASE_S3_ENDPOINT/
  # SUPABASE_S3_ACCESS_KEY_ID/SUPABASE_S3_SECRET_ACCESS_KEY are all set —
  # that's the supported way to turn recording on, not a manual `docker
  # compose --profile` invocation. A manual `up` against just this file
  # (without -f docker-compose.linux.yml on Linux) will recreate livekit/
  # livekit-redis WITHOUT their required network_mode: host override and
  # break calls entirely — always go through the installer scripts.
  egress:
    image: ${LIVEKIT_EGRESS_IMAGE:-livekit/egress:v1.9.0}
    container_name: ${RUNLY_CONTAINER_PREFIX:-runly}-livekit-egress
    profiles: ["livekit-egress"]
    restart: unless-stopped
    # Required by every LiveKit Egress deployment (including local/self-hosted)
    # since it runs Chrome for room-composite rendering — without it every
    # request fails with "chrome failed to start". See
    # docs.livekit.io/transport/self-hosting/egress/.
    cap_add:
      - SYS_ADMIN
    environment:
      - EGRESS_CONFIG_FILE=/etc/egress/egress.yaml
    volumes:
      # egress.yaml is written 0644 (see renderEgressConfig's callers), not
      # 0600 like livekit.yaml — the egress process runs as a non-root user
      # inside the container (unlike livekit-server, which runs as root), so
      # a 0600 root-owned bind mount reads as "permission denied" from
      # inside the container even though the host root user can read it fine.
      - ./livekit/egress.yaml:/etc/egress/egress.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      livekit-redis:
        condition: service_started
      livekit:
        condition: service_started

  # Servicio de transcripcion (docs/TRANSCRIPTION_SPEC.md) — perfil separado
  # por modo de despliegue ("transcription-local"/"transcription-external",
  # no un unico "transcription") porque Compose activa un servicio si
  # CUALQUIERA de sus perfiles esta en la lista pasada a `up`, no si TODOS lo
  # estan: un solo perfil "transcription" arrancaria ambas variantes local Y
  # external a la vez si alguna vez coincidieran en la misma invocacion.
  # setup-local.mjs/setup-external.mjs agregan el perfil correspondiente solo
  # cuando TRANSCRIPTION_MODE=local, igual que ya hacen con "livekit-egress"
  # para grabacion. Limites de CPU/RAM explicitos — primer precedente de este
  # patron en este compose (ver docs/TRANSCRIPTION_IMPLEMENTATION_PLAN.md,
  # Etapa 4): sin esto, un contenedor de Whisper sin acotar podria competir
  # por CPU con LiveKit/Egress en una VPS con pocos nucleos.
  # Sin `build:` a proposito — igual que runly-api-*/worker-*/web-*, se
  # publica via `pnpm docker:release:transcriber` (infra/docker/build-push.mjs)
  # y se referencia solo por imagen, nunca se construye localmente: el flujo
  # de instalacion real (bootstrap-local.sh) descarga una lista curada de
  # archivos del instalador, no el monorepo completo — un `build:` con
  # contexto ../.. no encontraria apps/transcriber/ en una instalacion real.
  runly-transcriber-local:
    image: ${RUNLY_TRANSCRIBER_IMAGE:-raulbellosom/runlyerp:transcriber-latest}
    container_name: ${RUNLY_CONTAINER_PREFIX:-runly}-transcriber-local
    profiles: ["transcription-local"]
    env_file:
      - ./.env.local
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      WHISPER_CPU_THREADS: ${WHISPER_CPU_THREADS:-2}
    volumes:
      - whisper-model-cache:/root/.cache/huggingface
    deploy:
      resources:
        limits:
          cpus: "${TRANSCRIBER_CPU_LIMIT:-1.5}"
          memory: ${TRANSCRIBER_MEMORY_LIMIT:-3g}
    restart: unless-stopped

  runly-transcriber-external:
    image: ${RUNLY_TRANSCRIBER_IMAGE:-raulbellosom/runlyerp:transcriber-latest}
    container_name: ${RUNLY_CONTAINER_PREFIX:-runly}-transcriber-external
    profiles: ["transcription-external"]
    env_file:
      - ./.env.external
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      WHISPER_CPU_THREADS: ${WHISPER_CPU_THREADS:-2}
    volumes:
      - whisper-model-cache:/root/.cache/huggingface
    deploy:
      resources:
        limits:
          cpus: "${TRANSCRIBER_CPU_LIMIT:-1.5}"
          memory: ${TRANSCRIBER_MEMORY_LIMIT:-3g}
    restart: unless-stopped

  # Servicio de texto a voz para "leer en voz alta" en MirAI (apps/tts/main.py,
  # scripts/poc-piper/RESULTS.md). A diferencia del transcriptor de arriba, es
  # SIN ESTADO — no toca Postgres ni Supabase Storage, no hay credencial de
  # minimo privilegio que aprovisionar — asi que un unico servicio compartido
  # por setup-local.mjs y setup-external.mjs es suficiente, sin el split
  # "-local"/"-external" que el transcriptor si necesita (ese existe porque
  # TRANSCRIBER_DATABASE_URL apunta a un Supabase distinto segun el modo de
  # instalacion; aqui no hay ninguna URL de base de datos que distinga). Sin
  # `build:` por la misma razon que runly-api-*/transcriber-*: se publica via
  # `pnpm docker:release:tts` y bootstrap-local.sh no descarga el monorepo
  # completo, solo una lista curada de archivos del instalador.
  runly-tts:
    image: ${RUNLY_TTS_IMAGE:-raulbellosom/runlyerp:tts-latest}
    container_name: ${RUNLY_CONTAINER_PREFIX:-runly}-tts
    profiles: ["mirai-tts"]
    environment:
      TTS_CPU_THREADS: ${TTS_CPU_THREADS:-2}
    deploy:
      resources:
        limits:
          cpus: "${TTS_CPU_LIMIT:-1}"
          memory: ${TTS_MEMORY_LIMIT:-512m}
    restart: unless-stopped

  livekit-caddy:
    image: ${LIVEKIT_CADDY_IMAGE:-caddy:2-alpine}
    container_name: ${RUNLY_CONTAINER_PREFIX:-runly}-livekit-caddy
    profiles: ["livekit-tls"]
    depends_on:
      - livekit
    volumes:
      - ./livekit/Caddyfile:/etc/caddy/Caddyfile:ro
      - livekit-caddy-data:/data
      - livekit-caddy-config:/config
    ports:
      # Standard ACME/HTTPS ports — only remap these if you know your ACME
      # flow tolerates it (most CAs assume 80/443). Prefer keeping an existing
      # host reverse proxy in front instead of changing these on a shared host.
      - "${LIVEKIT_TLS_HTTP_PORT:-80}:80/tcp"
      - "${LIVEKIT_TLS_HTTPS_PORT:-443}:443/tcp"
      - "${LIVEKIT_TLS_HTTPS_PORT:-443}:443/udp"
    restart: unless-stopped

volumes:
  livekit-caddy-data:
  livekit-caddy-config:
  # Cache del modelo de faster-whisper entre actualizaciones — sin esto, cada
  # `docker compose up --force-recreate` volveria a descargarlo desde
  # Hugging Face. Primer volumen con nombre de este tipo en el repo (ningun
  # otro servicio cachea un activo grande descargado en tiempo de ejecucion).
  whisper-model-cache:
