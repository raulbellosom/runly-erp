# Linux-only override: adds host.docker.internal to the local-profile containers.
# On Linux, Docker Engine does not inject host.docker.internal automatically, so
# we must provide it via host-gateway.
# On Docker Desktop (Windows/macOS), this file is NOT used — Docker Desktop injects
# host.docker.internal automatically and adding --add-host would override it with
# the wrong IP.
#
# Applied automatically by setup-local.mjs when process.platform === "linux".
# Manual usage on Linux:
#   docker compose -f docker-compose.yml -f docker-compose.linux.yml --profile local up -d

name: ${RUNLY_COMPOSE_PROJECT_NAME:-runlyerp}

services:
  collabora:
    extra_hosts:
      - "host.docker.internal:host-gateway"
  runly-api-local:
    extra_hosts:
      - "host.docker.internal:host-gateway"

  runly-worker-local:
    extra_hosts:
      - "host.docker.internal:host-gateway"

  runly-api-external:
    extra_hosts:
      - "host.docker.internal:host-gateway"

  runly-worker-external:
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # network_mode: host bypasses Docker Compose project isolation entirely —
  # these ports are claimed directly on the host's network stack, so a second
  # Runly instance with embedded LiveKit on the same Linux host collides here
  # unless LIVEKIT_REDIS_PORT/LIVEKIT_HTTP_HOST_PORT/LIVEKIT_RTC_*_PORT are set
  # to distinct values for that instance (see infra/installer/README.md).
  livekit-redis:
    network_mode: host
    expose: !reset []
    command: ["redis-server", "--bind", "127.0.0.1", "--port", "${LIVEKIT_REDIS_PORT:-6380}", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "${LIVEKIT_REDIS_PORT:-6380}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  livekit:
    network_mode: host
    ports: !reset []

  # Must share host networking with livekit/livekit-redis above: on Linux
  # those two are host-networked, so egress (still on the Compose bridge
  # network otherwise) could not resolve their Compose service names or
  # reach them at all. Its config (livekit/egress.yaml, rendered by
  # renderEgressConfig) points at 127.0.0.1 for exactly this reason.
  egress:
    network_mode: host

  livekit-caddy:
    network_mode: host
    ports: !reset []
