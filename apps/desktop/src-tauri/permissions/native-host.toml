[[permission]]
identifier = "allow-host-info"
description = "Read public host metadata."
commands.allow = ["host_info"]

[[permission]]
identifier = "allow-host-connect"
description = "Preflight and connect to the currently configured or a candidate server origin."
commands.allow = ["host_connect"]

[[permission]]
identifier = "allow-host-ready"
description = "Acknowledge successful React mount."
commands.allow = ["host_ready"]

[[permission]]
identifier = "allow-host-events"
description = "Read queued native navigation intents."
commands.allow = ["host_events"]

[[permission]]
identifier = "allow-host-ack-events"
description = "Acknowledge handled native navigation intents."
commands.allow = ["host_ack_events"]

[[permission]]
identifier = "allow-host-open-external"
description = "Open a validated HTTP(S) link in the system browser."
commands.allow = ["host_open_external"]

[[permission]]
identifier = "allow-host-screen-start"
description = "Request Android screen sharing with system consent."
commands.allow = ["host_screen_start"]

[[permission]]
identifier = "allow-host-notification-show"
description = "Show a local Android notification with a validated Atlas deep link."
commands.allow = ["host_notification_show"]

[[permission]]
identifier = "allow-host-screen-stop"
description = "Stop Android screen sharing."
commands.allow = ["host_screen_stop"]

[[permission]]
identifier = "allow-host-screen-status"
description = "Read Android screen sharing state without credentials."
commands.allow = ["host_screen_status"]

[[permission]]
identifier = "allow-host-confirm-origin"
description = "Persist and navigate to a server origin that already passed preflight."
commands.allow = ["host_confirm_origin"]

[[permission]]
identifier = "allow-host-forget-origin"
description = "Clear the currently trusted server origin."
commands.allow = ["host_forget_origin"]
